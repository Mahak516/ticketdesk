name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ticketdesk
          POSTGRES_PASSWORD: ticketdesk
          POSTGRES_DB: ticketdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketdesk -d ticketdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://ticketdesk:ticketdesk@localhost:5432/ticketdesk
        run: pytest
